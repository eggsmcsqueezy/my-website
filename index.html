<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jiwon — Coming Soon</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #faf8f4;
      color: #222;
      font-family: Georgia, serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .egg-wrap { width: min(340px, 80vw); }
    svg { width: 100%; height: auto; overflow: visible; }
    h1 { font-weight: normal; font-size: 2.4rem; margin: 0.4em 0 0.1em; }
    p { color: #666; margin: 0.2em 0; }

    /* squeeze animation */
    .egg {
      transform-origin: 200px 440px;
      animation: squish 1.6s ease-in-out infinite;
    }
    .hand-l { animation: pushL 1.6s ease-in-out infinite; }
    .hand-r { animation: pushR 1.6s ease-in-out infinite; }
    .pop { opacity: 0; animation: pop 1.6s ease-in-out infinite; }

    @keyframes squish {
      0%, 100% { transform: scale(1, 1); }
      50%      { transform: scale(0.86, 1.1); }
    }
    @keyframes pushL {
      0%, 100% { transform: translateX(0); }
      50%      { transform: translateX(22px); }
    }
    @keyframes pushR {
      0%, 100% { transform: translateX(0); }
      50%      { transform: translateX(-22px); }
    }
    @keyframes pop {
      0%, 35%, 75%, 100% { opacity: 0; }
      50%, 60%           { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .egg, .hand-l, .hand-r, .pop { animation: none; }
      .pop { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="egg-wrap">
    <svg viewBox="0 0 400 470" role="img" aria-label="A blond egg with a bowl cut and a green scarf being squeezed by two hands">
      <defs>
        <clipPath id="eggClip">
          <path d="M200 70 C 290 70, 330 200, 330 300 C 330 385, 275 440, 200 440 C 125 440, 70 385, 70 300 C 70 200, 110 70, 200 70 Z"/>
        </clipPath>
      </defs>

      <g stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">

        <!-- squeeze marks -->
        <g class="pop" fill="none">
          <path d="M150 40 L140 18"/>
          <path d="M200 32 L200 8"/>
          <path d="M250 40 L260 18"/>
        </g>

        <!-- the egg -->
        <g class="egg">
          <!-- ear -->
          <ellipse cx="322" cy="262" rx="17" ry="25" fill="#EBC9B5"/>

          <!-- egg body (skin) -->
          <path d="M200 70 C 290 70, 330 200, 330 300 C 330 385, 275 440, 200 440 C 125 440, 70 385, 70 300 C 70 200, 110 70, 200 70 Z" fill="#EBC9B5" stroke="none"/>

          <g clip-path="url(#eggClip)">
            <!-- hair -->
            <path d="M50 50 H350 V320 C 338 318, 326 300, 320 272 C 314 240, 306 210, 296 198 C 250 190, 150 186, 106 194 C 98 210, 92 240, 86 268 C 80 296, 66 318, 50 320 Z" fill="#E9C08A"/>
            <!-- scarf -->
            <path d="M50 362 Q 200 392 350 362 L 350 450 L 50 450 Z" fill="#5E7A52"/>
            <path d="M120 386 Q 160 400 190 398" fill="none" stroke-width="4"/>
            <path d="M230 396 Q 270 392 300 380" fill="none" stroke-width="4"/>
            <path d="M150 420 Q 200 428 250 418" fill="none" stroke-width="4"/>
          </g>

          <!-- egg outline -->
          <path d="M200 70 C 290 70, 330 200, 330 300 C 330 385, 275 440, 200 440 C 125 440, 70 385, 70 300 C 70 200, 110 70, 200 70 Z" fill="none"/>
          <!-- hairline -->
          <path d="M86 268 C 92 240, 98 210, 106 194 C 150 186, 250 190, 296 198 C 306 210, 314 240, 320 272" fill="none"/>

          <!-- hair strands + top tuft -->
          <g fill="none" stroke-width="4">
            <path d="M140 120 Q 148 170 196 186"/>
            <path d="M228 128 Q 236 172 274 190"/>
            <path d="M184 98 L 198 74"/>
            <path d="M200 100 L 208 72"/>
            <path d="M214 98 L 224 76"/>
          </g>

          <!-- face -->
          <g fill="none" stroke-width="4">
            <path d="M132 218 Q 152 206 176 214"/>
            <path d="M226 214 Q 250 208 272 222"/>
            <path d="M206 258 Q 194 282 200 296 Q 204 302 210 300"/>
            <path d="M184 334 Q 196 336 210 340"/>
          </g>
          <circle cx="158" cy="244" r="6" fill="#111" stroke="none"/>
          <circle cx="246" cy="250" r="6" fill="#111" stroke="none"/>
        </g>

        <!-- left hand -->
        <g class="hand-l">
          <path d="M-40 270 H 30 V 345 H -40 Z" fill="#3f413f"/>
          <path d="M28 268 C 50 262, 70 266, 84 276 C 96 284, 96 296, 86 300 C 98 306, 98 320, 86 324 C 96 332, 92 346, 78 348 C 60 352, 42 350, 28 346 Z" fill="#EBC9B5"/>
          <path d="M60 300 H 86" fill="none" stroke-width="4"/>
          <path d="M58 324 H 86" fill="none" stroke-width="4"/>
        </g>

        <!-- right hand (mirror) -->
        <g class="hand-r">
          <g transform="translate(400,0) scale(-1,1)">
            <path d="M-40 270 H 30 V 345 H -40 Z" fill="#3f413f"/>
            <path d="M28 268 C 50 262, 70 266, 84 276 C 96 284, 96 296, 86 300 C 98 306, 98 320, 86 324 C 96 332, 92 346, 78 348 C 60 352, 42 350, 28 346 Z" fill="#EBC9B5"/>
            <path d="M60 300 H 86" fill="none" stroke-width="4"/>
            <path d="M58 324 H 86" fill="none" stroke-width="4"/>
          </g>
        </g>
      </g>
    </svg>
  </div>

  <h1>Jiwon</h1>
  <p>Graphic essayist, webtoon artist, translator.</p>
  <p><em>Site coming soon.</em></p>
</body>
</html>
